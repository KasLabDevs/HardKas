name: KCC levels (silverc + simnet)

# R-09: the KCC-20 suites against the reference implementation KCC-20 links run in CI, at the silverc level (the pinned
# silverc) and at the simnet level (an isolated rusty-kaspad simnet node the test harness starts in this runner's Docker,
# by digest). The reference is not vendored (ISC): it is checked out at the pinned commit, and the tests check the digests
# of the files they read. Without it the suites fail (KCC20_REFERENCE_MISSING); nothing here skips them. The SilverScript
# runner level stays out of CI: upstream publishes no runner binary to pin.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kcc-levels:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Check out the KCC-20 reference implementation (pinned commit)
        uses: actions/checkout@v4
        with:
          repository: argent-lang/kcc20-reference
          ref: 27f8403fee55863125b044c73b2c9449d997a6ca
          path: .kcc20-reference
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          # NODE-CI-PIN-1: the exact patched release this code was validated on (not a floating major).
          node-version: 24.22.1

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.4

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Install pinned Kaspa WASM and silverc toolchains
        run: |
          node packages/cli/dist/index.js toolchain install kaspa-wasm
          node packages/cli/dist/index.js toolchain install silverc

      - name: KCC-20 at the silverc level
        env:
          HARDKAS_TEST_KCC20_REFERENCE: ${{ github.workspace }}/.kcc20-reference
        run: pnpm vitest run --config vitest.silverc.config.ts packages/core/test/kcc20-reference.silverc.test.ts

      - name: KCC-20 at the simnet level
        env:
          HARDKAS_TEST_KCC20_REFERENCE: ${{ github.workspace }}/.kcc20-reference
          HARDKAS_TEST_EVIDENCE_DIR: ${{ runner.temp }}/kcc20-evidence
        run: |
          mkdir -p "$HARDKAS_TEST_EVIDENCE_DIR"
          pnpm vitest run --config vitest.simnet.config.ts packages/testing/test/kcc20-reference.simnet.test.ts examples/11-kcc20-token/test/kcc20-token.simnet.test.ts

      - name: Upload the simnet evidence of this run
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kcc20-simnet-evidence
          path: ${{ runner.temp }}/kcc20-evidence/
          if-no-files-found: ignore
