name: Test levels (silverc, SilverScript runner, simnet)

# INT9 · D5: the three test levels outside the canonical gate, each one whole, on GitHub's disposable runner VM:
#   - silverc: `pnpm test:silverc` (the pinned silverc; KCC-20 against its reference implementation);
#   - SilverScript runner: `pnpm test:silver-runner`, with a cli-debugger built here from kaspanet/silverscript at the
#     pinned commit (upstream publishes no runner binary). The build is cached by commit; the commit is verified. The
#     runner stays UNVERIFIED by policy (its verdicts are never consensus evidence);
#   - simnet: `pnpm test:simnet`, every `*.simnet.test.ts`, against isolated rusty-kaspad nodes the harness starts in
#     this runner's Docker, by digest, with this run's labels and a data root in the runner's temp dir.
# It supersedes kcc-levels.yml (R-09): the KCC-20 suites are part of these levels and still fail without the
# reference (KCC20_REFERENCE_MISSING). The reference is not vendored (ISC): it is checked out at the pinned commit and
# the tests check the digests of the files they read. Nothing here skips a suite.
# No job has a mainnet endpoint, key or token, and none uses a secret: mainnet stays blocked by policy.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  # argent-lang/kcc20-reference, the KCC-20 reference implementation the KCC-20 suites read
  KCC20_REFERENCE_COMMIT: 27f8403fee55863125b044c73b2c9449d997a6ca
  # kaspanet/silverscript v1.0.0: the commit of the pinned silverc (fixtures/toccata-v2/silver/*/case.json)
  SILVERSCRIPT_COMMIT: 3ed973335b59269293564805cc2c58a14595ec03

jobs:
  silverc-level:
    name: silverc level (pnpm test:silverc)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (node24; resolved with git ls-remote on 2026-11-09)

      - name: Check out the KCC-20 reference implementation (pinned commit)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (node24; resolved with git ls-remote on 2026-11-09)
        with:
          repository: argent-lang/kcc20-reference
          ref: ${{ env.KCC20_REFERENCE_COMMIT }}
          path: .kcc20-reference
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0 (node24; resolved with git ls-remote on 2026-11-09)
        with:
          # NODE-CI-PIN-1: the exact patched release this code was validated on (not a floating major).
          node-version: 24.22.1

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0 (node24; resolved with git ls-remote on 2026-11-09)
        with:
          version: 9.15.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      # RC1 · R3: cached per pin set, every file verified against the pin, only a failed download retried
      # (.github/actions/hardkas-toolchains, scripts/ci-toolchain-install.mjs)
      - name: Install pinned Kaspa WASM and silverc toolchains
        uses: ./.github/actions/hardkas-toolchains
        with:
          ids: kaspa-wasm silverc

      - name: silverc level
        env:
          HARDKAS_TEST_KCC20_REFERENCE: ${{ github.workspace }}/.kcc20-reference
        run: pnpm test:silverc

  silver-runner-level:
    name: SilverScript runner level (pnpm test:silver-runner)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (node24; resolved with git ls-remote on 2026-11-09)

      - name: Check out the KCC-20 reference implementation (pinned commit)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (node24; resolved with git ls-remote on 2026-11-09)
        with:
          repository: argent-lang/kcc20-reference
          ref: ${{ env.KCC20_REFERENCE_COMMIT }}
          path: .kcc20-reference
          persist-credentials: false

      - name: Check out kaspanet/silverscript (pinned commit)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (node24; resolved with git ls-remote on 2026-11-09)
        with:
          repository: kaspanet/silverscript
          ref: ${{ env.SILVERSCRIPT_COMMIT }}
          path: .silverscript
          persist-credentials: false

      # The ref above could name a branch or a tag that moved: the checked-out HEAD must be the pinned commit itself.
      - name: Verify the silverscript commit
        run: |
          head="$(git -C .silverscript rev-parse HEAD)"
          echo "silverscript HEAD: $head"
          test "$head" = "$SILVERSCRIPT_COMMIT" || { echo "::error::silverscript HEAD is $head, not the pinned $SILVERSCRIPT_COMMIT"; exit 1; }

      # HK-22 · RC1 R3: pinned by commit like every other action (it went by the floating tag v4 on 157fc03e4).
      - name: Cache the cli-debugger build of the pinned commit
        id: runner-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0 (node24; resolved with git ls-remote on 2026-11-09)
        with:
          path: .silverscript/target/release/cli-debugger
          key: cli-debugger-${{ runner.os }}-${{ env.SILVERSCRIPT_COMMIT }}-${{ hashFiles('.silverscript/Cargo.lock', '.silverscript/rust-toolchain.toml', '.silverscript/rust-toolchain') }}

      - name: Build cli-debugger with cargo (cache miss only)
        if: steps.runner-cache.outputs.cache-hit != 'true'
        working-directory: .silverscript
        # --locked when the repository carries its Cargo.lock (the dependency versions of that commit)
        run: |
          if [ -f Cargo.lock ]; then cargo build --release --locked -p cli-debugger; else cargo build --release -p cli-debugger; fi

      # The runner is identified, never trusted: HardKAS has no trusted digest for any runner (R-04), so the level opts in
      # with HARDKAS_SILVER_RUNNER_TRUST=allow-unverified (vitest.silver-runner.config.ts) and labels every verdict
      # UNVERIFIED. The digest is printed so a run can be compared with another one.
      - name: Identify the runner
        run: |
          runner="$GITHUB_WORKSPACE/.silverscript/target/release/cli-debugger"
          test -x "$runner" || { echo "::error::no cli-debugger at $runner"; exit 1; }
          sha256sum "$runner"
          "$runner" --help | head -n 3
          echo "HARDKAS_SILVER_RUNNER=$runner" >> "$GITHUB_ENV"

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0 (node24; resolved with git ls-remote on 2026-11-09)
        with:
          # NODE-CI-PIN-1: the exact patched release this code was validated on (not a floating major).
          node-version: 24.22.1

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0 (node24; resolved with git ls-remote on 2026-11-09)
        with:
          version: 9.15.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      # RC1 · R3: cached per pin set, every file verified against the pin, only a failed download retried
      # (.github/actions/hardkas-toolchains, scripts/ci-toolchain-install.mjs)
      - name: Install pinned Kaspa WASM and silverc toolchains
        uses: ./.github/actions/hardkas-toolchains
        with:
          ids: kaspa-wasm silverc

      - name: SilverScript runner level
        env:
          HARDKAS_TEST_KCC20_REFERENCE: ${{ github.workspace }}/.kcc20-reference
        run: pnpm test:silver-runner

  simnet-level:
    name: simnet level (pnpm test:simnet)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (node24; resolved with git ls-remote on 2026-11-09)

      - name: Check out the KCC-20 reference implementation (pinned commit)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (node24; resolved with git ls-remote on 2026-11-09)
        with:
          repository: argent-lang/kcc20-reference
          ref: ${{ env.KCC20_REFERENCE_COMMIT }}
          path: .kcc20-reference
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0 (node24; resolved with git ls-remote on 2026-11-09)
        with:
          # NODE-CI-PIN-1: the exact patched release this code was validated on (not a floating major).
          node-version: 24.22.1

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0 (node24; resolved with git ls-remote on 2026-11-09)
        with:
          version: 9.15.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      # RC1 · R3: cached per pin set, every file verified against the pin, only a failed download retried
      # (.github/actions/hardkas-toolchains, scripts/ci-toolchain-install.mjs)
      - name: Install pinned Kaspa WASM and silverc toolchains
        uses: ./.github/actions/hardkas-toolchains
        with:
          ids: kaspa-wasm silverc

      - name: Pull the pinned node and miner images (by digest)
        run: |
          node -e "import('./packages/core/dist/index.js').then((m) => console.log([m.KASPAD_REFERENCE_IMAGE, m.CPUMINER_REFERENCE_IMAGE].join('\n')))" > images.txt
          cat images.txt
          xargs -n1 docker pull < images.txt

      # Every container the harness starts carries its role and run labels plus these; the run-scoped teardown removes
      # them. The node data goes to the runner's temp dir (HARDKAS_TEST_SIMNET_DATA_ROOT), never into the workspace.
      - name: simnet level
        env:
          HARDKAS_TEST_SIMNET_LABELS: hardkas.session=ci,hardkas.ci.run=${{ github.run_id }}-${{ github.run_attempt }}
          HARDKAS_TEST_SIMNET_DATA_ROOT: ${{ runner.temp }}/simnet-data
          HARDKAS_TEST_KCC20_REFERENCE: ${{ github.workspace }}/.kcc20-reference
          HARDKAS_TEST_EVIDENCE_DIR: ${{ runner.temp }}/kcc20-evidence
          HARDKAS_TEST_CLI_LIFECYCLE_TRACE: ${{ runner.temp }}/cli-lifecycle-trace.json
        run: |
          mkdir -p "$HARDKAS_TEST_SIMNET_DATA_ROOT" "$HARDKAS_TEST_EVIDENCE_DIR"
          pnpm test:simnet

      - name: No harness container is left behind
        if: always()
        run: |
          left="$(docker ps -aq --filter "label=hardkas.ci.run=${{ github.run_id }}-${{ github.run_attempt }}")"
          if [ -n "$left" ]; then docker ps -a --filter "label=hardkas.ci.run=${{ github.run_id }}-${{ github.run_attempt }}"; echo "::error::harness containers left behind"; exit 1; fi

      - name: Upload the simnet evidence and the CLI lifecycle trace
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (node24; resolved with git ls-remote on 2026-11-09)
        if: always()
        with:
          name: simnet-level-evidence
          path: |
            ${{ runner.temp }}/kcc20-evidence/
            ${{ runner.temp }}/cli-lifecycle-trace.json
          if-no-files-found: ignore
