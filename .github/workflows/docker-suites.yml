name: Docker suites (disposable runner)

# REMED-CLOSE: the suites that need a Docker engine of their own run here, on GitHub's disposable runner VM, never on a
# developer's engine:
#   - the node-management e2e, which resets the canonical localnet of the engine it reaches;
#   - the gauntlet in its canonical mode (the canonical localnet and its miner).
# Nothing is skipped: each one fails if its dependency is missing.
# INT9 · D5: the simnet suites that ran here one by one (the harness's container hygiene T-A06a/b, the simulator against
# rusty-kaspad, the CLI lifecycle and its trace) are part of the whole simnet level, `pnpm test:simnet`, in
# test-levels.yml, with this run's labels and data root.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-suites:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (node24; resolved with git ls-remote on 2026-11-09)

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0 (node24; resolved with git ls-remote on 2026-11-09)
        with:
          # NODE-CI-PIN-1: the exact patched release this code was validated on (not a floating major).
          node-version: 24.22.1

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0 (node24; resolved with git ls-remote on 2026-11-09)
        with:
          version: 9.15.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      # RC1 · R3: cached per pin set, every file verified against the pin, only a failed download retried
      # (.github/actions/hardkas-toolchains, scripts/ci-toolchain-install.mjs)
      - name: Install pinned Kaspa WASM and silverc toolchains
        uses: ./.github/actions/hardkas-toolchains
        with:
          ids: kaspa-wasm silverc

      - name: Pull the pinned node and miner images (by digest)
        run: |
          node -e "import('./packages/core/dist/index.js').then((m) => console.log([m.KASPAD_REFERENCE_IMAGE, m.CPUMINER_REFERENCE_IMAGE].join('\n')))" > images.txt
          cat images.txt
          xargs -n1 docker pull < images.txt

      # The harness hygiene (T-A06a/b), the simulator against rusty-kaspad (HK-22 / HK-06) and the CLI lifecycle
      # (L1-CORE-1 B1) run in test-levels.yml (simnet-level), inside `pnpm test:simnet`.

      - name: Node management e2e (resets the canonical localnet of THIS disposable engine)
        env:
          HARDKAS_TEST_E2E_NODE_MANAGEMENT: run
        run: pnpm vitest run --config vitest.e2e.config.ts --no-file-parallelism packages/cli/test/node-programmatic.e2e.test.ts

      - name: Gauntlet, canonical mode
        run: |
          cd packages/cli/test-gauntlet/real-node
          node ../../dist/index.js localnet start --toccata --json
          node ../../dist/index.js rpc health --wait --timeout 90000 --json
          cd "$GITHUB_WORKSPACE"
          pnpm gauntlet:toccata

      - name: Stop the canonical localnet
        if: always()
        run: |
          cd packages/cli/test-gauntlet/real-node
          node ../../dist/index.js localnet stop --toccata --json || echo "localnet stop failed (nothing else runs after this step)"
