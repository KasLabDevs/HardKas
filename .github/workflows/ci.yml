name: CI Parity (Cross-Platform Truth Equivalence)

on:
  # R-09: develop is where the work lands; CI runs there too, not only on main.
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

# HK-22: read-only token; no step here writes to the repository.
permissions:
  contents: read

jobs:
  # HK-22 / M-04: the canonical gate (`pnpm test` = vitest.config.ts + test:workflows) on the three platforms, from the
  # frozen lockfile. Only Ubuntu ran it before (hardkas-examples.yml); the gate there now lives here.
  canonical-gate:
    name: Canonical gate (pnpm test)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # NODE-CI-PIN-1: the exact patched release this code was validated on (not a floating major).
        node-version: [24.22.1]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (node24; resolved with git ls-remote on 2026-11-09)

      # RC1 · R3: on GitHub's Windows runner TEMP is an 8.3 short name (C:\Users\RUNNER~1\...). On 157fc03e4 the Windows
      # gate failed 3 tests on it: under vitest a file URL of that path (`~` written as %7E) does not load, and
      # `hardkas test` of a workspace there ran no test. RUNNER_TEMP (D:\a\_temp) has no short name.
      - name: Long-name temp directory (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0 (node24; resolved with git ls-remote on 2026-11-09)
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0 (node24; resolved with git ls-remote on 2026-11-09)
        with:
          version: 9.15.4

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Monorepo
        run: pnpm build

      # RC1 · R3: cached per pin set, every file verified against the pin, only a failed download retried
      # (.github/actions/hardkas-toolchains, scripts/ci-toolchain-install.mjs). silverc is pinned only for linux-x64 and
      # win32-x64, so macOS installs kaspa-wasm alone (on 157fc03e4 the macOS gate failed on `toolchain install silverc`,
      # which is not offered there); the canonical gate needs no silverc anyway (vitest.config.ts).
      - name: Install pinned toolchains
        uses: ./.github/actions/hardkas-toolchains
        with:
          ids: ${{ runner.os == 'macOS' && 'kaspa-wasm' || 'kaspa-wasm silverc' }}

      - name: Canonical gate
        run: pnpm test

  # INT9 · D5: the release and docs gates, which ran only by hand: the published set and the version freeze, the CLI
  # references (docs/reference/cli.* and the apps/docs pages) against the command tree, the generated claims, the docs
  # links and versions, the site map, the known-gap skips, the forbidden claims and the dependency licenses of the
  # published packages (offline, from the lockfile). One step per gate, so a red one names itself.
  docs-gates:
    name: Release and docs gates
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (node24; resolved with git ls-remote on 2026-11-09)

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0 (node24; resolved with git ls-remote on 2026-11-09)
        with:
          # NODE-CI-PIN-1: the exact patched release this code was validated on (not a floating major).
          node-version: 24.22.1

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0 (node24; resolved with git ls-remote on 2026-11-09)
        with:
          version: 9.15.4

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Monorepo
        run: pnpm build

      - name: Published set and version freeze (version:check)
        run: pnpm version:check

      - name: CLI reference (docs:check-cli)
        run: pnpm docs:check-cli

      - name: apps/docs CLI pages (docs:check-apps-cli)
        run: pnpm docs:check-apps-cli

      - name: Generated claims (docs:check-claims)
        run: pnpm docs:check-claims

      - name: Docs drift (check:docs)
        run: pnpm check:docs

      - name: Docs links and versions (docs:check)
        run: pnpm docs:check

      - name: Site map (docs:check-site)
        run: pnpm docs:check-site

      - name: Known-gap skips (check-known-gaps)
        run: node scripts/check-known-gaps.mjs

      - name: Forbidden claims (check-forbidden-claims)
        run: node scripts/check-forbidden-claims.mjs

      - name: Dependency licenses (check-licenses)
        run: pnpm check:licenses

      # RC1 · R3: green since its three non-schema strings are classified (scripts/check-artifact-registry.mjs).
      - name: Artifact schema registry (check-artifact-registry)
        run: node scripts/check-artifact-registry.mjs

  # RC1 · R3: the release tarballs, packed as a publish packs them, before anything is published (nothing is published
  # here and no token exists in CI): first an offline audit of every tarball, then a consumer project that installs
  # the tarballs (their third-party dependencies from npmjs) and runs the CLI and the SDK from them.
  release-tarballs:
    name: Release tarballs (audit and consumer smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (node24; resolved with git ls-remote on 2026-11-09)

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0 (node24; resolved with git ls-remote on 2026-11-09)
        with:
          # NODE-CI-PIN-1: the exact patched release this code was validated on (not a floating major).
          node-version: 24.22.1

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0 (node24; resolved with git ls-remote on 2026-11-09)
        with:
          version: 9.15.4

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Monorepo
        run: pnpm build

      - name: Tarball audit (check-release-tarballs)
        run: node scripts/check-release-tarballs.mjs --pack --dir "$RUNNER_TEMP/release-tarballs" --report "$RUNNER_TEMP/release-tarballs.json"

      - name: Consumer smoke from the tarballs (packaging:smoke)
        run: pnpm packaging:smoke

  semantic-equivalence:
    name: Cross-Platform Semantic Test
    runs-on: ${{ matrix.os }}
    # RC1 · R3: bounded like the other jobs (GitHub's default is 6 h); it took ~12 min on 230123e87.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # NODE-CI-PIN-1: the exact patched release this code was validated on (not a floating major).
        node-version: [24.22.1]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (node24; resolved with git ls-remote on 2026-11-09)

      # RC1 · R3: the same long-name temp directory as the canonical gate (Windows TEMP is an 8.3 short name).
      - name: Long-name temp directory (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0 (node24; resolved with git ls-remote on 2026-11-09)
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0 (node24; resolved with git ls-remote on 2026-11-09)
        with:
          version: 9.15.4

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Monorepo
        run: pnpm build

      # HardKAS loads only the pinned official Kaspa WASM SDK; the install
      # verifies the release asset and every file against the pin.
      # RC1 · R3: cached per pin set, only a failed download retried (.github/actions/hardkas-toolchains).
      - name: Install pinned Kaspa WASM toolchain
        uses: ./.github/actions/hardkas-toolchains
        with:
          ids: kaspa-wasm

      - name: Run Torture Matrix (Seed 42)
        run: pnpm hardkas torture matrix --iterations 300 --seed 42

      - name: Run Torture Matrix (Seed 999)
        run: pnpm hardkas torture matrix --iterations 300 --seed 999

      - name: Run Abuse & Fault Injection Tests
        run: pnpm vitest run abuse-multiprocess soak-longrun fault-injection

      - name: Run Benchmarks
        run: pnpm vitest run benchmark
        env:
          BENCHMARK_CI: true

      # SURFACE-TRUTH-1: there is no semantic-hash comparison. `verify-semantics` refuses
      # (VERIFY_SEMANTICS_UNSUPPORTED) instead of writing synthetic hashes, and this job never
      # compared them across platforms anyway, so the step that only generated them is gone.

      - name: Upload Telemetry and Reports
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (node24; resolved with git ls-remote on 2026-11-09)
        if: always()
        with:
          name: torture-reports-${{ matrix.os }}
          # N-9: `pnpm hardkas torture` runs the CLI's dev script in packages/cli, so its reports land there.
          path: |
            packages/cli/.hardkas/reports/
            packages/cli/.hardkas/telemetry/telemetry.jsonl
            .hardkas/reports/
            .hardkas/telemetry/telemetry.jsonl
