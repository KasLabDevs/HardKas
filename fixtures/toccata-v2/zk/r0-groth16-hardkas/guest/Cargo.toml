[package]
name = "hk-r0-probe"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[workspace]
resolver = "3"

[dependencies]
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std"] }
risc0-zkvm-platform = { version = "=2.2.2", default-features = false }
risc0-core = { version = "=3.0.1", default-features = false }

[profile.release]
lto = true
opt-level = 3
